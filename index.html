<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>हमारा गाँव हमारी जिम्मेदारी</title>
    <style>
        :root {
            --primary: #058239;
            --secondary: #ff9933;
            --dark: #222;
            --light: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
            color: var(--dark);
        }

        header {
            background: linear-gradient(135deg, var(--secondary), #ffffff, var(--primary));
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            color: #111;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .tab-btn.active {
            border-bottom: 3px solid var(--primary);
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button.btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button.btn-submit:hover {
            background-color: #04632b;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card-preview {
            border: 2px dashed #ccc;
            padding: 10px;
            text-align: center;
            margin-top: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #fff;
        }

        .status-pending { background-color: #f39c12; }
        .status-approved { background-color: #2ecc71; }
        .status-resolved { background-color: #27ae60; }

        .issue-item {
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 10px;
            background: #fafafa;
        }
    </style>
</head>
<body>

<header>
    <h1>🚩 हमारा गाँव हमारी जिम्मेदारी</h1>
</header>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('memberTab')">👥 सदस्य आवेदन</button>
        <button class="tab-btn" onclick="switchTab('issueTab')">🚨 समस्या दर्ज करें</button>
        <button class="tab-btn" onclick="switchTab('statusTab')">🔍 स्टेटस देखें</button>
    </div>

    <!-- 1. सदस्यता आवेदन फॉर्म -->
    <div id="memberTab" class="tab-content active">
        <h3>सदस्यता फॉर्म</h3>
        <form id="memberForm" onsubmit="submitMemberForm(event)">
            <div class="form-group">
                <label>पूरा नाम:</label>
                <input type="text" required placeholder="अपना नाम लिखें">
            </div>
            <div class="form-group">
                <label>मोबाइल नंबर:</label>
                <input type="tel" required pattern="[0-9]{10}" placeholder="10 अंकों का नंबर">
            </div>
            <div class="form-group">
                <label>मोहल्ला / वार्ड:</label>
                <input type="text" required placeholder="वार्ड नंबर या मोहल्ला">
            </div>
            <div class="form-group">
                <label>पासपोर्ट साइज फोटो:</label>
                <input type="file" accept="image/*" required onchange="compressImage(event, 'memberPhoto')">
            </div>
            <button type="submit" class="btn-submit">आवेदन जमा करें</button>
        </form>
    </div>

    <!-- 2. समस्या दर्ज करने का फॉर्म -->
    <div id="issueTab" class="tab-content">
        <h3>गाँव की समस्या दर्ज करें</h3>
        <form id="issueForm" onsubmit="submitIssueForm(event)">
            <div class="form-group">
                <label>शिकायतकर्ता का नाम:</label>
                <input type="text" id="issueName" required placeholder="अपना नाम लिखें">
            </div>
            <div class="form-group">
                <label>मोबाइल नंबर:</label>
                <input type="tel" id="issuePhone" required pattern="[0-9]{10}">
            </div>
            <div class="form-group">
                <label>समस्या की श्रेणी (Category):</label>
                <select id="issueCategory" required>
                    <option value="">-- चुनें --</option>
                    <option value="पानी">🚰 पानी की समस्या</option>
                    <option value="बिजली">💡 बिजली / स्ट्रीट लाइट</option>
                    <option value="सड़क व नाली">🛣️ सड़क व नाली</option>
                    <option value="सफाई">🧹 साफ-सफाई व कचरा</option>
                    <option value="अन्य">❓ अन्य समस्या</option>
                </select>
            </div>
            <div class="form-group">
                <label>स्थान / वार्ड नंबर:</label>
                <input type="text" id="issueLocation" required placeholder="समस्या कहाँ पर है?">
            </div>
            <div class="form-group">
                <label>समस्या का विवरण (Detail):</label>
                <textarea id="issueDesc" rows="3" required placeholder="समस्या के बारे में विस्तार से लिखें..."></textarea>
            </div>
            <div class="form-group">
                <label>समस्या की फोटो (यदि हो):</label>
                <input type="file" accept="image/*" onchange="compressImage(event, 'issuePhoto')">
            </div>
            <button type="submit" class="btn-submit">समस्या दर्ज करें</button>
        </form>
    </div>

    <!-- 3. स्टेटस देखने का सेक्शन -->
    <div id="statusTab" class="tab-content">
        <h3>अपनी समस्या या आवेदन का स्टेटस चेक करें</h3>
        <div class="form-group">
            <input type="text" id="searchID" placeholder="Ticket ID या मोबाइल नंबर दर्ज करें">
        </div>
        <button type="button" class="btn-submit" onclick="checkStatus()">खोजें</button>
        
        <div id="statusResult" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
    // इमेज कंप्रेसर फ़ंक्शन (Browser Hang होने से बचाएगा)
    let compressedMemberPhoto = "";
    let compressedIssuePhoto = "";

    function compressImage(event, type) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxWidth = 600;
                const scaleSize = maxWidth / img.width;
                canvas.width = maxWidth;
                canvas.height = img.height * scaleSize;

                const ctx = canvas.getContext('canvas');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                const compressedUrl = canvas.toDataURL('image/jpeg', 0.7); // 70% Quality
                
                if (type === 'memberPhoto') compressedMemberPhoto = compressedUrl;
                if (type === 'issuePhoto') compressedIssuePhoto = compressedUrl;
            }
        }
    }

    // टैब बदलने का फ़ंक्शन
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // सदस्यता फॉर्म सबमिट
    function submitMemberForm(e) {
        e.preventDefault();
        alert("आपका आवेदन सफलता पूर्वक जमा हो गया है! स्टेटस: Pending (एडमिन अप्रूवल के बाद Member ID मिलेगी।)");
        e.target.reset();
    }

    // समस्या फॉर्म सबमिट
    function submitIssueForm(e) {
        e.preventDefault();
        const ticketId = "ISSUE-" + Math.floor(1000 + Math.random() * 9000);
        
        const issueData = {
            id: ticketId,
            name: document.getElementById('issueName').value,
            phone: document.getElementById('issuePhone').value,
            category: document.getElementById('issueCategory').value,
            location: document.getElementById('issueLocation').value,
            desc: document.getElementById('issueDesc').value,
            photo: compressedIssuePhoto,
            status: "Pending"
        };

        // लोकल स्टोरेज में सेव (डेमो के लिए)
        let issues = JSON.parse(localStorage.getItem('village_issues') || '[]');
        issues.push(issueData);
        localStorage.setItem('village_issues', JSON.stringify(issues));

        alert(`आपकी समस्या दर्ज कर ली गई है।\nशिकायत संख्या (Ticket ID): ${ticketId}`);
        e.target.reset();
    }

    // स्टेटस चेक फ़ंक्शन
    function checkStatus() {
        const query = document.getElementById('searchID').value.trim();
        const issues = JSON.parse(localStorage.getItem('village_issues') || '[]');
        const resultDiv = document.getElementById('statusResult');

        const found = issues.filter(i => i.id === query || i.phone === query);

        if (found.length === 0) {
            resultDiv.innerHTML = "<p style='color:red;'>कोई रिकॉर्ड नहीं मिला।</p>";
            return;
        }

        let html = "<h4>दर्ज समस्याएं:</h4>";
        found.forEach(item => {
            html += `
                <div class="issue-item">
                    <b>ID:</b> ${item.id} <br>
                    <b>श्रेणी:</b> ${item.category} <br>
                    <b>विवरण:</b> ${item.desc} <br>
                    <b>स्थिति:</b> <span class="status-badge status-pending">${item.status}</span>
                </div>
            `;
        });
        resultDiv.innerHTML = html;
    }
</script>

</body>
</html>
