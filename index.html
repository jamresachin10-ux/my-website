<!doctype html>
<html lang="hi">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>हमारा गाँव हमारी जिम्मेदारी</title>
  <style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7f3;color:#172018}
header{background:#176b3a;color:#fff;padding:18px 12px;text-align:center}header h1{margin:0;font-size:22px}
nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px;background:#fff;position:sticky;top:0;z-index:5}
button{border:0;border-radius:10px;padding:12px;font-size:16px;background:#176b3a;color:#fff}
nav button{background:#edf5ef;color:#176b3a;font-weight:bold}
main{max-width:720px;margin:auto;padding:12px}section{display:none;background:#fff;padding:16px;border-radius:14px;box-shadow:0 2px 8px #0001}section.active{display:block}
h2{color:#176b3a}.notice{background:#eff7f0;padding:12px;margin:8px 0;border-radius:8px;border-left:4px solid #176b3a}
label{display:block;font-weight:bold;margin-top:12px}input,textarea,select{width:100%;padding:12px;margin-top:5px;border:1px solid #ccd5cd;border-radius:9px;font-size:16px}textarea{min-height:100px}
.card{border:2px solid #176b3a;border-radius:14px;padding:16px;text-align:center;margin-top:12px}.hidden{display:none}.danger{background:#a51d2d}.small{font-size:13px;color:#667}
</style>
 </head>
 <body>
  <header>
   <h1>🌾 हमारा गाँव हमारी जिम्मेदारी</h1>
   <div>गाँव की जानकारी • सदस्यता • समस्याएँ</div>
  </header>
  <nav>
   <button onclick="show('home')">🏠 होम</button>
   <button onclick="show('join')">👥 सदस्य बनें</button>
   <button onclick="show('issue')">📢 मुद्दा रखें</button>
   <button onclick="show('card')">🪪 ID Card</button>
   <button onclick="show('qr')">🤓 QR SMART</button>
   <button onclick="show('admin')">🔐 मेरा Admin</button>
  </nav>
  <main>
   <section id="home" class="active">
    <h2>🏠 होम</h2>
    <h3>📢 महत्वपूर्ण सूचना</h3>
    <div id="notices"></div>
   </section>
   <section id="join">
    <h2>👥 सदस्य बनें</h2>
    <form id="joinForm">
     <label>नाम</label><input id="jname" required> <label>मोबाइल</label><input id="jmobile" inputmode="numeric" maxlength="10" required> <label>गाँव/वार्ड</label><input id="jward" required> <label>उम्र</label><input id="jage" type="number">
     <button type="submit">आवेदन जमा करें</button>
    </form>
    <p id="joinMsg"></p>
   </section>
   <section id="issue">
    <h2>📢 मुद्दा रखें</h2>
    <form id="issueForm">
     <label>नाम</label><input id="iname" required> <label>मोबाइल</label><input id="imobile" inputmode="numeric" maxlength="10" required> <label>मुद्दा</label><textarea id="itext" required></textarea>
     <button type="submit">मुद्दा भेजें</button>
    </form>
    <p id="issueMsg"></p>
   </section>
   <section id="card">
    <h2>🪪 ID Card</h2>
    <input id="cmobile" inputmode="numeric" maxlength="10" placeholder="Approved सदस्य का मोबाइल">
    <button onclick="makeCard()" style="margin-top:10px">ID Card देखें</button>
    <div id="cardOut"></div>
   </section>
   <section id="qr">
    <h2>🤓 QR SMART</h2>
    <p class="small">अपनी Live website का URL डालकर QR बनाएं।</p>
    <input id="url" placeholder="https://...github.io/...">
    <button onclick="makeQR()" style="margin-top:10px">QR बनाएं</button>
    <div id="qrOut"></div>
   </section>
   <section id="admin">
    <h2>🔐 मेरा Admin</h2>
    <div id="login">
     <input id="pass" type="password" placeholder="Admin password">
     <button onclick="login()" style="margin-top:10px">Admin खोलें</button>
     <p id="loginMsg"></p>
    </div>
    <div id="panel" class="hidden">
     <h3>📊 Admin Control</h3>
     <div id="counts"></div>
     <label>नई महत्वपूर्ण सूचना</label><textarea id="newNotice"></textarea>
     <button onclick="addNotice()">सूचना प्रकाशित करें</button>
     <h3>👥 सदस्य आवेदन</h3>
     <div id="members"></div>
     <h3>📢 मुद्दे</h3>
     <div id="issues"></div>
     <button class="danger" onclick="logout()">Logout</button>
    </div>
   </section>
  </main>
  <script>
const $=id=>document.getElementById(id);
const load=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d));
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function show(id){document.querySelectorAll('section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}
function mobileOk(x){return /^\d{10}$/.test(x)}
$('joinForm').onsubmit=e=>{e.preventDefault();let m=$('jmobile').value.trim();if(!mobileOk(m)){ $('joinMsg').textContent='10 अंकों का मोबाइल नंबर डालें';return}let a=load('members',[]);a.push({id:'M'+Date.now().toString().slice(-6),name:$('jname').value.trim(),mobile:m,ward:$('jward').value.trim(),age:$('jage').value,approved:false});save('members',a);e.target.reset();$('joinMsg').textContent='आवेदन जमा हो गया। Admin approval के बाद ID Card मिलेगा।'};
$('issueForm').onsubmit=e=>{e.preventDefault();let a=load('issues',[]);a.push({name:$('iname').value.trim(),mobile:$('imobile').value.trim(),text:$('itext').value.trim(),date:new Date().toLocaleString('hi-IN')});save('issues',a);e.target.reset();$('issueMsg').textContent='मुद्दा भेज दिया गया।'};
let ap=localStorage.getItem('adminPassword');if(!ap){ap='123456';localStorage.setItem('adminPassword',ap)}
function login(){if($('pass').value===localStorage.getItem('adminPassword')){$('login').classList.add('hidden');$('panel').classList.remove('hidden');renderAdmin()}else $('loginMsg').textContent='गलत password'}
function logout(){$('login').classList.remove('hidden');$('panel').classList.add('hidden');$('pass').value=''}
function renderAdmin(){let m=load('members',[]),i=load('issues',[]);$('counts').innerHTML='<div class="notice">कुल सदस्य आवेदन: '+m.length+' | Approved: '+m.filter(x=>x.approved).length+' | मुद्दे: '+i.length+'</div>';$('members').innerHTML=m.length?m.map((x,n)=>'<div class="notice"><b>'+x.name+'</b><br>'+x.mobile+' • '+x.ward+'<br>स्थिति: '+(x.approved?'Approved ✅':'Pending ⏳')+(x.approved?'':'<br><button onclick="approve('+n+')">Approve</button>')+'</div>').join(''):'कोई आवेदन नहीं';$('issues').innerHTML=i.length?i.map(x=>'<div class="notice"><b>'+x.name+'</b><br>'+x.text+'<br><span class="small">'+x.date+'</span></div>').join(''):'कोई मुद्दा नहीं'}
function approve(n){let a=load('members',[]);a[n].approved=true;save('members',a);renderAdmin()}
function addNotice(){let t=$('newNotice').value.trim();if(!t)return;let a=load('notices',[]);a.unshift(t);save('notices',a);$('newNotice').value='';renderNotices()}
function renderNotices(){let a=load('notices',[]);$('notices').innerHTML=a.length?a.map(x=>'<div class="notice">'+x+'</div>').join(''):'<div class="notice">अभी कोई नई सूचना नहीं है।</div>'}
function makeCard(){let x=load('members',[]).find(v=>v.mobile===$('cmobile').value.trim()&&v.approved);$('cardOut').innerHTML=x?'<div class="card"><h2>🌾 हमारा गाँव</h2><h3>'+x.name+'</h3><p>Member ID: <b>'+x.id+'</b></p><p>'+x.ward+'</p><b>Approved ✅</b></div>':'<div class="notice">Approved सदस्य नहीं मिला।</div>'}
function makeQR(){let u=$('url').value.trim();if(!u){$('qrOut').textContent='पहले Live URL डालें';return}$('qrOut').innerHTML='<p>QR तैयार है:</p><img style="max-width:220px" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(u)+'">'}
renderNotices();
</script>
 </body>
</html>
