<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ग्राम पंचायत जोजलवाड़ी — हमारा गाँव हमारी जिम्मेदारी</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:sans-serif;background:#f4f6f8;color:#333}
    .hero{background:linear-gradient(135deg,#1b7e42,#0b5326);color:#fff;padding:20px;text-align:center;border-bottom-left-radius:20px;border-bottom-right-radius:20px}
    .hero h1{margin:5px 0 10px;font-size:22px}
    .tag{background:#ffe600;color:#000;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold}
    .tabs{display:flex;justify-content:space-around;background:#fff;margin:-15px 15px 15px;padding:8px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.08)}
    .tab{border:none;background:none;padding:8px 12px;font-weight:bold;color:#666;cursor:pointer;border-radius:8px}
    .tab.active{background:#e8f5e9;color:#1b7e42}
    .section{display:none;padding:0 15px 20px}
    .section.active{display:block}
    .card{background:#fff;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
    .btn{width:100%;background:#1b7e42;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
    .btn-approve{background:#2e7d32;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer}
    .btn-reject{background:#c62828;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;margin-left:5px}
    input, textarea{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:6px}
    .item-card{border-left:4px solid #f39c12;padding:10px;background:#f9f9f9;margin-bottom:10px;border-radius:4px}
    .item-card.approved{border-left-color:#27ae60}
    .status-badge{font-size:11px;padding:2px 6px;border-radius:4px;color:#fff;display:inline-block;margin-top:4px}
    .pending-bg{background:#f39c12}
    .approved-bg{background:#27ae60}
  </style>
</head>
<body>

  <div class="hero">
    <span class="tag">केवल ग्राम पंचायत जोजलवाड़ी</span>
    <h1>हमारा गाँव हमारी जिम्मेदारी</h1>
    <div>👑 मुख्य संयोजक — dimagi naxal e</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('home')">🏠 होम</button>
    <button class="tab" onclick="showTab('join')">👥 सदस्य</button>
    <button class="tab" onclick="showTab('issue')">📝 समस्या</button>
    <button class="tab" onclick="showTab('admin')">⚙️ Admin</button>
  </div>

  <!-- Home Section -->
  <div id="home" class="section active">
    <div class="card">
      <h3>स्वीकृत सदस्य (Approved Members)</h3>
      <div id="approved-members-list">कोई स्वीकृत सदस्य नहीं है।</div>
    </div>
  </div>

  <!-- Join Form -->
  <div id="join" class="section">
    <div class="card">
      <h3>सदस्यता फ़ॉर्म</h3>
      <input type="text" id="m-name" placeholder="आपका पूरा नाम">
      <input type="text" id="m-phone" placeholder="मोबाइल नंबर">
      <button class="btn" onclick="submitMember()">आवेदन जमा करें</button>
    </div>
  </div>

  <!-- Issue Form -->
  <div id="issue" class="section">
    <div class="card">
      <h3>समस्या दर्ज करें</h3>
      <input type="text" id="i-name" placeholder="आपका नाम">
      <textarea id="i-desc" placeholder="समस्या का विवरण लिखें..."></textarea>
      <button class="btn" onclick="submitIssue()">रिपोर्ट जमा करें</button>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="admin" class="section">
    <div class="card" id="admin-login-box">
      <h3>⚙️ एडमिन लॉगिन</h3>
      <input type="password" id="admin-pass" placeholder="पासवर्ड दर्ज करें (Default: 1234)">
      <button class="btn" onclick="loginAdmin()">लॉगिन करें</button>
    </div>

    <div class="card" id="admin-dashboard" style="display:none;">
      <h3>⚙️ Admin Panel (Approval Control)</h3>
      <button onclick="logoutAdmin()" style="float:right;background:#666;color:#fff;border:none;padding:4px 8px;border-radius:4px;">लॉगआउट</button>
      
      <h4>pending सदस्य आवेदन</h4>
      <div id="admin-member-requests"></div>

      <h4 style="margin-top:20px;">Pending समस्या रिपोर्ट</h4>
      <div id="admin-issue-requests"></div>
    </div>
  </div>

  <script>
    let members = JSON.parse(localStorage.getItem('members')) || [];
    let issues = JSON.parse(localStorage.getItem('issues')) || [];

    function showTab(id){
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      renderAll();
    }

    function submitMember(){
      let name = document.getElementById('m-name').value;
      let phone = document.getElementById('m-phone').value;
      if(!name || !phone) return alert('कृपया पूरी जानकारी भरें');
      members.push({ id: Date.now(), name, phone, status: 'pending' });
      localStorage.setItem('members', JSON.stringify(members));
      alert('आपका आवेदन एडमिन (Sachin Jamre) के अप्रूवल के लिए भेज दिया गया है।');
      document.getElementById('m-name').value = '';
      document.getElementById('m-phone').value = '';
      showTab('home');
    }

    function submitIssue(){
      let name = document.getElementById('i-name').value;
      let desc = document.getElementById('i-desc').value;
      if(!name || !desc) return alert('कृपया पूरी जानकारी भरें');
      issues.push({ id: Date.now(), name, desc, status: 'pending' });
      localStorage.setItem('issues', JSON.stringify(issues));
      alert('आपकी समस्या दर्ज हो गई है। एडमिन के अप्रूवल के बाद दिखेगी।');
      document.getElementById('i-name').value = '';
      document.getElementById('i-desc').value = '';
      showTab('home');
    }

    function loginAdmin(){
      let pass = document.getElementById('admin-pass').value;
      if(pass === '1234'){
        document.getElementById('admin-login-box').style.display = 'none';
        document.getElementById('admin-dashboard').style.display = 'block';
        renderAdminPanel();
      } else {
        alert('गलत पासवर्ड!');
      }
    }

    function logoutAdmin(){
      document.getElementById('admin-login-box').style.display = 'block';
      document.getElementById('admin-dashboard').style.display = 'none';
      document.getElementById('admin-pass').value = '';
    }

    function approveMember(id){
      members = members.map(m => m.id === id ? {...m, status: 'approved'} : m);
      localStorage.setItem('members', JSON.stringify(members));
      renderAll();
    }

    function rejectMember(id){
      members = members.filter(m => m.id !== id);
      localStorage.setItem('members', JSON.stringify(members));
      renderAll();
    }

    function approveIssue(id){
      issues = issues.map(i => i.id === id ? {...i, status: 'approved'} : i);
      localStorage.setItem('issues', JSON.stringify(issues));
      renderAll();
    }

    function rejectIssue(id){
      issues = issues.filter(i => i.id !== id);
      localStorage.setItem('issues', JSON.stringify(issues));
      renderAll();
    }

    function renderAdminPanel(){
      let mHtml = '';
      members.forEach(m => {
        mHtml += `<div class="item-card ${m.status}">
          <b>${m.name}</b> (${m.phone})<br>
          <span class="status-badge ${m.status==='approved'?'approved-bg':'pending-bg'}">${m.status.toUpperCase()}</span><br><br>
          ${m.status === 'pending' ? `
            <button class="btn-approve" onclick="approveMember(${m.id})">Approve</button>
            <button class="btn-reject" onclick="rejectMember(${m.id})">Reject</button>
          ` : ''}
        </div>`;
      });
      document.getElementById('admin-member-requests').innerHTML = mHtml || 'कोई नया आवेदन नहीं है।';

      let iHtml = '';
      issues.forEach(i => {
        iHtml += `<div class="item-card ${i.status}">
          <b>${i.name}:</b> ${i.desc}<br>
          <span class="status-badge ${i.status==='approved'?'approved-bg':'pending-bg'}">${i.status.toUpperCase()}</span><br><br>
          ${i.status === 'pending' ? `
            <button class="btn-approve" onclick="approveIssue(${i.id})">Approve</button>
            <button class="btn-reject" onclick="rejectIssue(${i.id})">Reject</button>
          ` : ''}
        </div>`;
      });
      document.getElementById('admin-issue-requests').innerHTML = iHtml || 'कोई नई समस्या रिपोर्ट नहीं है।';
    }

    function renderAll(){
      let approvedM = members.filter(m => m.status === 'approved');
      let hHtml = '';
      approvedM.forEach(m => {
        hHtml += `<div class="item-card approved"><b>👤 ${m.name}</b></div>`;
      });
      document.getElementById('approved-members-list').innerHTML = hHtml || 'अभी कोई स्वीकृत सदस्य नहीं है।';
      renderAdminPanel();
    }

    renderAll();
  </script>
</body>
</html>
