<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ग्राम पंचायत जोजलवाड़ी</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
    body{background:#f0f4f8;padding:15px;color:#333}
    .card{background:#fff;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
    h2, h3{color:#1b7e42;margin-bottom:10px}
    label{font-size:12px;font-weight:bold;display:block;margin:8px 0 4px}
    input, select, textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:8px}
    .btn{width:100%;background:#1b7e42;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer}
    .nav-btn{background:#e8f5e9;color:#1b7e42;border:1px solid #1b7e42;padding:8px 12px;border-radius:6px;font-weight:bold;margin-right:5px;cursor:pointer}
    .active-nav{background:#1b7e42;color:#fff}
    .box{display:none}
    .box.show{display:block}
  </style>
</head>
<body>

  <div style="text-align:center;margin-bottom:15px;">
    <h2>👑 ग्राम पंचायत जोजलवाड़ी</h2>
    <p>संयोजक: Sachin Jamre</p>
  </div>

  <div style="margin-bottom:15px;text-align:center;">
    <button class="nav-btn active-nav" onclick="openSection('home-sec', this)">🏠 होम</button>
    <button class="nav-btn" onclick="openSection('admin-sec', this)">⚙️ एडमिन कंट्रोल</button>
  </div>

  <!-- HOME SECTION -->
  <div id="home-sec" class="box show">
    <div class="card">
      <h3>🏛️ पंचायत विवरण</h3>
      <p><b>सरपंच:</b> <span id="view-sarpanch">श्री सरपंच जी</span></p>
      <p><b>मोबाइल:</b> <span id="view-sarpanch-p">9876543210</span></p>
      <hr style="margin:10px 0;">
      <p><b>सचिव:</b> <span id="view-sachiv">श्री सचिव जी</span></p>
      <p><b>मोबाइल:</b> <span id="view-sachiv-p">9876543211</span></p>
    </div>

    <div class="card" style="background:#fff8e1;">
      <h3>📢 मुख्य सूचना</h3>
      <p id="view-notice">गाँव में स्वच्छता अभियान जारी है।</p>
    </div>
  </div>

  <!-- ADMIN SECTION -->
  <div id="admin-sec" class="box">
    <div class="card" style="border:2px solid #1b7e42;">
      <h3>⚙️ एडमिन अपडेट (Direct Control)</h3>
      
      <label>सरपंच का नाम:</label>
      <input type="text" id="in-sarpanch" placeholder="सरपंच का नाम लिखें">
      
      <label>सरपंच का नंबर:</label>
      <input type="tel" id="in-sarpanch-p" placeholder="मोबाइल नंबर">

      <label>सचिव का नाम:</label>
      <input type="text" id="in-sachiv" placeholder="सचिव का नाम लिखें">
      
      <label>सचिव का नंबर:</label>
      <input type="tel" id="in-sachiv-p" placeholder="मोबाइल नंबर">

      <label>नोटिस / सूचना टेक्स्ट:</label>
      <textarea id="in-notice" rows="3" placeholder="गाँव के लिए सूचना लिखें"></textarea>

      <button class="btn" onclick="saveData()">अपडेट सेव करें</button>
    </div>
  </div>

  <script>
    function openSection(secId, btnElement) {
      document.getElementById('home-sec').classList.remove('show');
      document.getElementById('admin-sec').classList.remove('show');
      
      var btns = document.getElementsByClassName('nav-btn');
      for(var i=0; i<btns.length; i++){
        btns[i].classList.remove('active-nav');
      }

      document.getElementById(secId).classList.add('show');
      btnElement.classList.add('active-nav');
    }

    function saveData() {
      var sarpanch = document.getElementById('in-sarpanch').value;
      var sarpanchP = document.getElementById('in-sarpanch-p').value;
      var sachiv = document.getElementById('in-sachiv').value;
      var sachivP = document.getElementById('in-sachiv-p').value;
      var notice = document.getElementById('in-notice').value;

      if(sarpanch) document.getElementById('view-sarpanch').innerText = sarpanch;
      if(sarpanchP) document.getElementById('view-sarpanch-p').innerText = sarpanchP;
      if(sachiv) document.getElementById('view-sachiv').innerText = sachiv;
      if(sachivP) document.getElementById('view-sachiv-p').innerText = sachivP;
      if(notice) document.getElementById('view-notice').innerText = notice;

      alert('डेटा अपडेट हो गया है!');
      openSection('home-sec', document.getElementsByClassName('nav-btn')[0]);
    }
  </script>
</body>
  </html>
