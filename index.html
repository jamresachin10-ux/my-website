<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>हमारा गाँव हमारी जिम्मेदारी — जिला स्तरीय नागरिक पोर्टल</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
    body{background:#f4f7f6;color:#333;padding-bottom:40px}

    /* Header Section */
    .header{background:linear-gradient(135deg,#0d5c2e,#1b7e42);color:#fff;padding:25px 15px;text-align:center;border-bottom-left-radius:25px;border-bottom-right-radius:25px;box-shadow:0 4px 15px rgba(0,0,0,0.15)}
    .header-logo{width:90px;height:90px;border-radius:50%;border:3px solid #ffe600;background:#fff;object-fit:cover;margin-bottom:8px;box-shadow:0 4px 10px rgba(0,0,0,0.3)}
    .header-tag{background:#ffe600;color:#000;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:bold;display:inline-block;margin-bottom:8px}
    .header h1{font-size:22px;margin-bottom:4px}
    .header p{font-size:12px;opacity:0.9}

    /* Navigation Tabs */
    .nav-tabs{display:flex;justify-content:space-around;background:#fff;margin:15px 12px;padding:6px;border-radius:15px;box-shadow:0 3px 10px rgba(0,0,0,0.08)}
    .tab-btn{border:none;background:none;padding:10px 5px;font-weight:bold;color:#666;font-size:13px;cursor:pointer;border-radius:10px;flex:1;text-align:center;transition:0.2s}
    .tab-btn.active{background:#e8f5e9;color:#1b7e42}

    /* Container & Cards */
    .container{padding:0 12px}
    .page-section{display:none}
    .page-section.active{display:block}

    .card{background:#fff;padding:18px;border-radius:16px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.05);border:1px solid #e2e8f0}
    .card h3{font-size:16px;color:#1b7e42;margin-bottom:12px;border-bottom:2px solid #e8f5e9;padding-bottom:6px}

    label{font-size:12px;font-weight:bold;color:#444;display:block;margin:10px 0 4px}
    input, select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:13px;outline:none;background:#f8fafc}
    input:focus, select:focus{border-color:#1b7e42;background:#fff}

    .btn{width:100%;background:#1b7e42;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer;margin-top:12px;box-shadow:0 3px 8px rgba(27,126,66,0.2)}

    /* District VIP Member Card */
    .vip-card{background:linear-gradient(135deg,#062b14,#0d5c2e,#1b7e42);color:#fff;padding:16px;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,0.2);border:2px solid #ffe600;margin-top:10px;position:relative}
    .vc-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.2);padding-bottom:8px;margin-bottom:12px}
    .vc-header-left{display:flex;align-items:center;gap:8px}
    .card-logo{width:35px;height:35px;border-radius:50%;border:1px solid #ffe600;background:#fff;object-fit:cover}
    .vc-header h4{font-size:13px;color:#ffe600}
    .vc-body{display:flex;gap:12px;align-items:center}
    .vc-photo{width:75px;height:75px;border-radius:50%;border:2px solid #ffe600;object-fit:cover;background:#fff;padding:2px}
    .vc-details p{font-size:11px;margin-bottom:3px;opacity:0.95}
    .vc-footer{margin-top:10px;background:rgba(0,0,0,0.3);padding:8px;border-radius:8px;text-align:center}
    .vc-id{font-family:monospace;font-size:13px;color:#ffe600;font-weight:bold;letter-spacing:1px}
    .vc-title{font-size:11px;color:#fff;font-weight:bold;margin-top:2px}
    .vc-slogan{font-size:9px;color:#a5d6a7;font-style:italic}

    /* Admin List */
    .admin-item{background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:12px;margin-bottom:10px}
    .admin-item-top{display:flex;gap:10px;align-items:center}
    .admin-item-top img{width:45px;height:45px;border-radius:50%;object-fit:cover;border:1px solid #ccc}
    .btn-group{display:flex;gap:8px;margin-top:10px}
    .btn-acc{background:#2e7d32;color:#fff;border:none;padding:8px;border-radius:6px;flex:1;font-weight:bold;font-size:12px;cursor:pointer}
    .btn-rej{background:#c62828;color:#fff;border:none;padding:8px;border-radius:6px;flex:1;font-weight:bold;font-size:12px;cursor:pointer}
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="header">
    <img src="1000467791.png" class="header-logo" alt="लोगो" onerror="this.style.display='none'">
    <br>
    <span class="header-tag">जिला स्तरीय नागरिक अभियान</span>
    <h1>हमारा गाँव हमारी जिम्मेदारी</h1>
    <p>संस्थापक / एडमिन: <b>DIMAGI NAXAL</b></p>
  </div>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" id="tb-form" onclick="switchTab('form')">✍️ जुड़ें (सदस्यता)</button>
    <button class="tab-btn" id="tb-search" onclick="switchTab('search')">🔍 प्रोफाइल / कार्ड</button>
    <button class="tab-btn" id="tb-admin" onclick="switchTab('admin')">⚙️ Admin Panel</button>
  </div>

  <div class="container">
    
    <!-- 1. DISTRICT REGISTRATION FORM -->
    <div id="sec-form" class="page-section active">
      <div class="card">
        <h3>👥 जिला स्तरीय सदस्यता फॉर्म</h3>
        
        <label>आपका पूरा नाम *</label>
        <input type="text" id="reg-name" placeholder="नाम दर्ज करें">

        <label>मोबाइल नंबर *</label>
        <input type="tel" id="reg-phone" placeholder="10 अंकों का नंबर">

        <label>जिला (District) चुनें *</label>
        <select id="reg-district">
          <option value="">-- जिला चुनें --</option>
          <option value="खरगोन">खरगोन (Khargone)</option>
          <option value="बड़वानी">बड़वानी (Barwani)</option>
          <option value="धार">धार (Dhar)</option>
          <option value="इंदौर">इंदौर (Indore)</option>
          <option value="खंडवा">खंडवा (Khandwa)</option>
          <option value="अन्य जिला">अन्य जिला (Other)</option>
        </select>

        <label>तहसील / ब्लॉक चुनें *</label>
        <select id="reg-tehsil">
          <option value="">-- तहसील/ब्लॉक चुनें --</option>
          <option value="सेगांव">सेगांव</option>
          <option value="खरगोन">खरगोन</option>
          <option value="भगवानपुरा">भगवानपुरा</option>
          <option value="भीकनगांव">भीकनगांव</option>
          <option value="झिरन्या">झिरन्या</option>
          <option value="कसरावद">कसरावद</option>
          <option value="महेश्वर">महेश्वर</option>
          <option value="बड़वाह">बड़वाह</option>
          <option value="अन्य तहसील">अन्य तहसील</option>
        </select>

        <label>सदस्यता पद / भूमिका *</label>
        <select id="reg-role">
          <option value="सक्रिय नागरिक सदस्य">सक्रिय नागरिक सदस्य</option>
          <option value="युवा कार्यकर्ता">युवा कार्यकर्ता</option>
          <option value="ग्राम संयोजक">ग्राम संयोजक</option>
          <option value="ब्लॉक प्रतिनिधि">ब्लॉक प्रतिनिधि</option>
          <option value="जिला प्रतिनिधि">जिला प्रतिनिधि</option>
        </select>

        <label>ग्राम / शहर / वार्ड का नाम *</label>
        <input type="text" id="reg-village" placeholder="उदा: तलकपुरा / जोजलवाड़ी">

        <button class="btn" type="button" onclick="submitRegistration()">सदस्यता आवेदन जमा करें</button>
      </div>
    </div>

    <!-- 2. CARD SEARCH -->
    <div id="sec-search" class="page-section">
      <div class="card">
        <h3>🔍 सदस्यता कार्ड खोजें</h3>
        <label>रजिस्टर्ड मोबाइल नंबर दर्ज करें</label>
        <input type="tel" id="find-phone" placeholder="उदा: 9876543210">
        <button class="btn" style="background:#0288d1;" onclick="findMemberCard()">कार्ड देखें</button>
        
        <div id="card-result-box" style="margin-top:15px;"></div>
      </div>
    </div>

    <!-- 3. ADMIN PANEL -->
    <div id="sec-admin" class="page-section">
      <div class="card" id="admin-login-view">
        <h3>🔐 एडमिन लॉगिन</h3>
        <p style="font-size:11px;color:#666;margin-bottom:10px;">केवल एडमिन (DIMAGI NAXAL) हेतु</p>
        <label>पासवर्ड</label>
        <input type="password" id="admin-password-input" placeholder="पासवर्ड दर्ज करें">
        <button class="btn" onclick="adminLogin()">लॉगिन</button>
      </div>

      <div id="admin-dashboard-view" style="display:none;">
        <div class="card" style="background:#e8f5e9;border-color:#c8e6c9;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <h4>👑 Admin Panel (DIMAGI NAXAL)</h4>
            <button onclick="adminLogout()" style="background:#c62828;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer;">लॉगआउट</button>
          </div>
        </div>

        <div class="card">
          <h3>👥 जिला स्तरीय आवेदन सूची</h3>
          <div id="admin-applicants-list"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    var PASS_KEY = "sachin@312";

    var memberData = JSON.parse(localStorage.getItem('district_members_db') || '[]');

    function switchTab(tabName){
      document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('sec-' + tabName).classList.add('active');
      document.getElementById('tb-' + tabName).classList.add('active');
    }

    function submitRegistration(){
      var name = document.getElementById('reg-name').value.trim();
      var phone = document.getElementById('reg-phone').value.trim();
      var district = document.getElementById('reg-district').value;
      var tehsil = document.getElementById('reg-tehsil').value;
      var role = document.getElementById('reg-role').value;
      var village = document.getElementById('reg-village').value.trim();

      if(!name || !phone || !district || !tehsil || !village){
        alert('कृपया सभी आवश्यक जानकारी भरें!');
        return;
      }

      if(phone.length < 10){
        alert('कृपया 10 अंकों का सही मोबाइल नंबर दर्ज करें!');
        return;
      }

      memberData.push({
        id: Date.now(),
        name: name,
        phone: phone,
        district: district,
        tehsil: tehsil,
        role: role,
        village: village,
        status: 'pending',
        memberId: ''
      });

      localStorage.setItem('district_members_db', JSON.stringify(memberData));
      alert('आपका आवेदन सफलतापूर्वक जमा हो गया है! एडमिन स्वीकृति के बाद कार्ड दिखाई देगा।');

      document.getElementById('reg-name').value = '';
      document.getElementById('reg-phone').value = '';
      document.getElementById('reg-district').value = '';
      document.getElementById('reg-tehsil').value = '';
      document.getElementById('reg-village').value = '';
    }

    function findMemberCard(){
      var phone = document.getElementById('find-phone').value.trim();
      var box = document.getElementById('card-result-box');
      box.innerHTML = '';

      if(!phone){ alert('मोबाइल नंबर दर्ज करें!'); return; }

      var user = memberData.find(m => m.phone === phone);

      if(!user){
        box.innerHTML = '<p style="color:red;font-size:12px;text-align:center;">कोई रिकॉर्ड नहीं मिला। पहले फॉर्म भरें।</p>';
        return;
      }

      if(user.status === 'pending'){
        box.innerHTML = '<div style="background:#fff8e1;color:#f57f17;padding:12px;border-radius:10px;text-align:center;font-size:12px;border:1px solid #ffe082;">⏳ आपका आवेदन अभी समीक्षा में है। एडमिन स्वीकृति के बाद कार्ड दिखेगा।</div>';
        return;
      }

      box.innerHTML = `
        <div class="vip-card">
          <div class="vc-header">
            <div class="vc-header-left">
              <img src="1000467791.png" class="card-logo" alt="Logo" onerror="this.src='https://via.placeholder.com/35'">
              <h4>जिला: ${user.district}</h4>
            </div>
            <span style="font-size:10px;background:#ffe600;color:#000;padding:2px 6px;border-radius:4px;font-weight:bold;">${user.role}</span>
          </div>
          <div class="vc-body">
            <img src="1000467791.png" class="vc-photo" alt="Badge" onerror="this.src='https://via.placeholder.com/75'">
            <div class="vc-details">
              <p>नाम: <strong>${user.name}</strong></p>
              <p>तहसील/ब्लॉक: <strong>${user.tehsil}</strong></p>
              <p>ग्राम/वार्ड: <strong>${user.village}</strong></p>
              <p>भूमिका: <strong>${user.role}</strong></p>
            </div>
          </div>
          <div class="vc-footer">
            <div class="vc-id">ID: ${user.memberId}</div>
            <div class="vc-title">हमारा गाँव हमारी जिम्मेदारी</div>
            <div class="vc-slogan">"एक सोच, एक प्रयास, बेहतर गाँव"</div>
          </div>
        </div>
      `;
    }

    function adminLogin(){
      var pass = document.getElementById('admin-password-input').value.trim();
      if(pass === PASS_KEY){
        document.getElementById('admin-login-view').style.display = 'none';
        document.getElementById('admin-dashboard-view').style.display = 'block';
        renderAdminList();
      } else {
        alert('गलत पासवर्ड!');
      }
    }

    function adminLogout(){
      document.getElementById('admin-login-view').style.display = 'block';
      document.getElementById('admin-dashboard-view').style.display = 'none';
      document.getElementById('admin-password-input').value = '';
    }

    function renderAdminList(){
      var listDiv = document.getElementById('admin-applicants-list');
      if(memberData.length === 0){
        listDiv.innerHTML = '<p style="font-size:12px;color:#777;">कोई आवेदन दर्ज नहीं है।</p>';
        return;
      }

      listDiv.innerHTML = memberData.map(m => `
        <div class="admin-item">
          <div class="admin-item-top">
            <img src="1000467791.png" onerror="this.src='https://via.placeholder.com/45'">
            <div>
              <strong style="font-size:13px;">${m.name}</strong> (${m.phone})<br>
              <span style="font-size:11px;color:#666;">जिला: ${m.district} | तहसील: ${m.tehsil} | पद: ${m.role}</span><br>
              <span style="font-size:10px;font-weight:bold;color:${m.status === 'approved' ? '#2e7d32' : '#f39c12'}">
                स्थिति: ${m.status.toUpperCase()} ${m.memberId ? '(' + m.memberId + ')' : ''}
              </span>
            </div>
          </div>
          ${m.status === 'pending' ? `
            <div class="btn-group">
              <button class="btn-acc" onclick="approveMember(${m.id})">Approve & Card दें</button>
              <button class="btn-rej" onclick="deleteMember(${m.id})">Reject</button>
            </div>
          ` : `
            <div style="margin-top:8px;text-align:right;">
              <button onclick="deleteMember(${m.id})" style="background:#c62828;color:#fff;border:none;padding:4px 8px;border-radius:4px;font-size:10px;cursor:pointer;">हटाएं</button>
            </div>
          `}
        </div>
      `).join('');
    }

    function approveMember(id){
      var generatedID = 'DIST-' + Math.floor(10000 + Math.random() * 90000);
      memberData = memberData.map(m => {
        if(m.id === id){
          return Object.assign({}, m, { status: 'approved', memberId: generatedID });
        }
        return m;
      });
      localStorage.setItem('district_members_db', JSON.stringify(memberData));
      renderAdminList();
    }

    function deleteMember(id){
      if(confirm('क्या आप इसे हटाना चाहते हैं?')){
        memberData = memberData.filter(m => m.id !== id);
        localStorage.setItem('district_members_db', JSON.stringify(memberData));
        renderAdminList();
      }
    }
  </script>
</body>
          </html>
